[package]
name = "pkm"
version = "0.2.0-dev"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
const-oid = "0.9"
der = "0.7"
directories = "5.0"
keyring = "2.3"
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
rand_core = "0.6"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
spki = "0.7"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
x509-cert = "0.2"
yubihsm = { version = "0.42.1", features = ["usb"] }
